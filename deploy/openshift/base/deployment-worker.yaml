# dps-worker: L2 jobs (discover, run prepare/partitions/finalize, retention; contract §3.5). Claims
# from the Postgres queue with the worker login; serves /health, /readyz, /metrics on ops (9400).
# SIGTERM drains (stop claiming, keep leases while in-flight work finishes, release the rest), so the
# grace period is longer than DPS_JOB_DRAIN_TIMEOUT_SECONDS (30). Same pod security as dps-app, and
# the same wait for the release's schema (it would exit on MigrationDrift and crash-loop otherwise).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dps-worker
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: worker}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: worker}
    spec:
      serviceAccountName: dps-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # dps-app's init container, unchanged (deployment-app.yaml says why; a test keeps them equal)
      initContainers:
        - name: wait-for-schema
          image: data-privacy-services
          args:
            - sh
            - -c
            - "trap 'exit 143' TERM INT; until python -m dps.migrate --verify; do sleep 5 & wait $!; done"
          envFrom: [{configMapRef: {name: dps}}]
          env:
            - {name: HOME, value: /tmp}
            - {name: DPS_PG_PASSWORD_FILE, value: /var/run/secrets/dps/pg-app/password}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/dps/ca, readOnly: true}
            - {name: pg-app, mountPath: /var/run/secrets/dps/pg-app, readOnly: true}
      containers:
        - name: worker
          image: data-privacy-services
          args: ["python", "-m", "dps.worker"]
          ports: [{name: ops, containerPort: 9400, protocol: TCP}]
          envFrom: [{configMapRef: {name: dps}}]
          # The worker boots through the same posture guard as the app (it needs DPS_API_KEYS_FILE
          # too) and opens both pools at start (dps/worker.py _amain: db.init_pool with the app
          # login, db.init_worker_pool with the worker login); the engine keeps the LLM (COIN), OCR
          # and tokenizer secrets.
          env:
            - {name: HOME, value: /tmp}
            - {name: DPS_PG_PASSWORD_FILE, value: /var/run/secrets/dps/pg-app/password}
            - {name: DPS_PG_WORKER_PASSWORD_FILE, value: /var/run/secrets/dps/pg-worker/password}
            - {name: DPS_JOB_KEK_FILE, value: /var/run/secrets/dps/kek/kek}
            - {name: DPS_API_KEYS_FILE, value: /var/run/secrets/dps/api-keys/api_keys.json}
            - {name: DPS_COIN_CLIENT_ID_FILE, value: /var/run/secrets/dps/coin/client_id}
            - {name: DPS_COIN_CLIENT_SECRET_FILE, value: /var/run/secrets/dps/coin/client_secret}
            - {name: DPS_COIN_SCOPE_FILE, value: /var/run/secrets/dps/coin/scope}
            - {name: DPS_TOKENIZER_TOKEN_FILE, value: /var/run/secrets/dps/tokenizer/token}
            - {name: DPS_AZURE_VISION_KEY_FILE, value: /var/run/secrets/dps/ocr/key}
            - {name: DPS_S3_ACCESS_KEY_ID_FILE, value: /var/run/secrets/dps/s3/access_key_id}
            - {name: DPS_S3_SECRET_ACCESS_KEY_FILE, value: /var/run/secrets/dps/s3/secret_access_key}
          startupProbe: {httpGet: {path: /health, port: ops}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: ops}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: ops}, periodSeconds: 10, failureThreshold: 6}
          # copula fit of 100k rows + transform batches (DPS_WORKER_CONCURRENCY=4)
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/dps/ca, readOnly: true}
            - {name: pg-app, mountPath: /var/run/secrets/dps/pg-app, readOnly: true}
            - {name: pg-worker, mountPath: /var/run/secrets/dps/pg-worker, readOnly: true}
            - {name: kek, mountPath: /var/run/secrets/dps/kek, readOnly: true}
            - {name: api-keys, mountPath: /var/run/secrets/dps/api-keys, readOnly: true}
            - {name: coin, mountPath: /var/run/secrets/dps/coin, readOnly: true}
            - {name: tokenizer, mountPath: /var/run/secrets/dps/tokenizer, readOnly: true}
            - {name: ocr, mountPath: /var/run/secrets/dps/ocr, readOnly: true}
            - {name: s3, mountPath: /var/run/secrets/dps/s3, readOnly: true}
            - {name: refs, mountPath: /var/run/secrets/dps/refs, readOnly: true}
            - {name: exports, mountPath: /mnt/dps-exports}
      volumes:
        # files targets spool each partition under /tmp before the upload (dps/layers/connectors/files.py)
        - {name: tmp, emptyDir: {sizeLimit: 4Gi}}
        - {name: ca, configMap: {name: dps-ca-bundle}}
        - {name: pg-app, secret: {secretName: dps-pg-app, defaultMode: 288}}
        - {name: pg-worker, secret: {secretName: dps-pg-worker, defaultMode: 288}}
        - {name: kek, secret: {secretName: dps-job-kek, defaultMode: 288}}
        - {name: api-keys, secret: {secretName: dps-api-keys, defaultMode: 288}}
        - {name: coin, secret: {secretName: dps-coin, defaultMode: 288}}
        - {name: tokenizer, secret: {secretName: dps-tokenizer, defaultMode: 288}}
        - {name: ocr, secret: {secretName: dps-ocr, defaultMode: 288}}
        - {name: s3, secret: {secretName: dps-s3, defaultMode: 288}}
        - {name: refs, secret: {secretName: dps-connector-refs, defaultMode: 288, optional: true}}
        # created by the platform (README): pvc targets write under DPS_EXPORT_ROOT
        - {name: exports, persistentVolumeClaim: {claimName: dps-exports}}
