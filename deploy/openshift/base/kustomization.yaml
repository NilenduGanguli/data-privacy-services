# Base: everything identical in every environment. One image, four roles (spec §4): app, worker,
# browser-worker (its own image, M4), migrate. The metadata database is external (dps-db
# ExternalName to the platform PostgreSQL); Oracle Free and the other source-system mocks are never
# deployed here. Placeholders (zero digests, .invalid hosts, 192.0.2.0/24 peers, the Job name
# dps-migrate-0) are set by the release overlay: deploy/openshift/README.md lists every one, and
# `python tools/openshift_check.py <release> --fail-on-warn` refuses a release that still has one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccounts.yaml
  - deployment-app.yaml
  - deployment-worker.yaml
  - deployment-browser-worker.yaml
  - job-migrate.yaml
  - service-app.yaml
  - service-dps-db.yaml
  - route-app.yaml
  - pdb.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dps
    envs: [configmap-dps.env]
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: data-privacy-services
