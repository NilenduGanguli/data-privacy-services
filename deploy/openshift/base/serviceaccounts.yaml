# One ServiceAccount per role, none of which talks to the Kubernetes API: no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dps-app
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: app}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dps-worker
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dps-browser-worker
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: browser-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dps-migrate
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: migrate}
automountServiceAccountToken: false
