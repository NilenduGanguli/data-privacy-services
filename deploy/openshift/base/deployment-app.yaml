# dps-app: API + console (port 8400). Stateless for Layer 1; reads the metadata DB for jobs, keys,
# reports; opens source connections only to test and browse them (the worker does the jobs).
# Runs under OpenShift's arbitrary UID (restricted-v2): no runAsUser, a read-only root, /tmp an
# emptyDir and HOME=/tmp. Every secret is a mounted file named by a *_FILE variable (posture guard).
# Starts only once the release's schema is in place (init container wait-for-schema, below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dps-app
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: app}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: app}
    spec:
      serviceAccountName: dps-app
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # The release's schema first. Compose starts the app and the workers only after its migrate
      # one-shot completed; Kubernetes has no such order, and a release applies the migrate Job with
      # the Deployments. The app verifies the schema once at boot: started before the Job committed,
      # it kept its job platform down (503 on every database route) while staying Ready. So the pod
      # waits until `python -m dps.migrate --verify` passes: the migrations this image ships, read
      # with the app login (no DDL). Same image, the ConfigMap, the app login only; `args` keep the
      # image's entrypoint; the trap ends the wait at once on SIGTERM (a deleted pod).
      initContainers:
        - name: wait-for-schema
          image: data-privacy-services
          args:
            - sh
            - -c
            - "trap 'exit 143' TERM INT; until python -m dps.migrate --verify; do sleep 5 & wait $!; done"
          envFrom: [{configMapRef: {name: dps}}]
          env:
            - {name: HOME, value: /tmp}
            - {name: DPS_PG_PASSWORD_FILE, value: /var/run/secrets/dps/pg-app/password}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/dps/ca, readOnly: true}
            - {name: pg-app, mountPath: /var/run/secrets/dps/pg-app, readOnly: true}
      containers:
        - name: app
          image: data-privacy-services
          # The image's entrypoint runs `python -m dps.migrate` only when DPS_MIGRATIONS_MODE=auto;
          # the ConfigMap says verify (the migrate Job applies DDL). --no-access-log: uvicorn's
          # access log is stdlib logging and would bypass the structlog allow-list.
          args: ["uvicorn", "dps.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8400",
                 "--proxy-headers", "--no-access-log"]
          ports: [{name: http, containerPort: 8400, protocol: TCP}]
          envFrom: [{configMapRef: {name: dps}}]
          env:
            - {name: HOME, value: /tmp}
            - {name: DPS_PG_PASSWORD_FILE, value: /var/run/secrets/dps/pg-app/password}
            - {name: DPS_JOB_KEK_FILE, value: /var/run/secrets/dps/kek/kek}
            - {name: DPS_API_KEYS_FILE, value: /var/run/secrets/dps/api-keys/api_keys.json}
            - {name: DPS_COIN_CLIENT_ID_FILE, value: /var/run/secrets/dps/coin/client_id}
            - {name: DPS_COIN_CLIENT_SECRET_FILE, value: /var/run/secrets/dps/coin/client_secret}
            - {name: DPS_COIN_SCOPE_FILE, value: /var/run/secrets/dps/coin/scope}
            - {name: DPS_TOKENIZER_TOKEN_FILE, value: /var/run/secrets/dps/tokenizer/token}
            - {name: DPS_AZURE_VISION_KEY_FILE, value: /var/run/secrets/dps/ocr/key}
            - {name: DPS_S3_ACCESS_KEY_ID_FILE, value: /var/run/secrets/dps/s3/access_key_id}
            - {name: DPS_S3_SECRET_ACCESS_KEY_FILE, value: /var/run/secrets/dps/s3/secret_access_key}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: ca, mountPath: /etc/dps/ca, readOnly: true}
            - {name: pg-app, mountPath: /var/run/secrets/dps/pg-app, readOnly: true}
            - {name: kek, mountPath: /var/run/secrets/dps/kek, readOnly: true}
            - {name: api-keys, mountPath: /var/run/secrets/dps/api-keys, readOnly: true}
            - {name: coin, mountPath: /var/run/secrets/dps/coin, readOnly: true}
            - {name: tokenizer, mountPath: /var/run/secrets/dps/tokenizer, readOnly: true}
            - {name: ocr, mountPath: /var/run/secrets/dps/ocr, readOnly: true}
            - {name: s3, mountPath: /var/run/secrets/dps/s3, readOnly: true}
            - {name: refs, mountPath: /var/run/secrets/dps/refs, readOnly: true}
            # POST /connections/{id}/test of a pvc target puts and deletes a probe object here
            - {name: exports, mountPath: /mnt/dps-exports}
      # Secret files are 0440 (288): owner root, group = the pod's fsGroup, which restricted-v2
      # assigns from the namespace range, so the arbitrary UID reads them through its group.
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
        - {name: ca, configMap: {name: dps-ca-bundle}}
        - {name: pg-app, secret: {secretName: dps-pg-app, defaultMode: 288}}
        - {name: kek, secret: {secretName: dps-job-kek, defaultMode: 288}}
        - {name: api-keys, secret: {secretName: dps-api-keys, defaultMode: 288}}
        - {name: coin, secret: {secretName: dps-coin, defaultMode: 288}}
        - {name: tokenizer, secret: {secretName: dps-tokenizer, defaultMode: 288}}
        - {name: ocr, secret: {secretName: dps-ocr, defaultMode: 288}}
        - {name: s3, secret: {secretName: dps-s3, defaultMode: 288}}
        - {name: refs, secret: {secretName: dps-connector-refs, defaultMode: 288, optional: true}}
        # created by the platform (README), ReadWriteMany: the app and every worker replica mount it
        - {name: exports, persistentVolumeClaim: {claimName: dps-exports}}
