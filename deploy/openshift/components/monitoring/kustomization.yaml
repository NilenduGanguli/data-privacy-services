# User-workload monitoring: a PodMonitor over the three long-running roles and the alerts of
# HANDOFF §5 (the raw-PII-to-LLM alert must never fire). Needs user-workload monitoring enabled on
# the cluster (README).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - podmonitor.yaml
  - prometheusrule.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: data-privacy-services
