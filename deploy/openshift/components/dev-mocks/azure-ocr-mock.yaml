# The Azure Computer Vision Read v3.2 mock (Tesseract inside; built from ../mock_azure_ocr, compose
# service azure-ocr-mock) on port 5000. Any key is accepted; the dev dps-ocr secret holds a dummy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dps-azure-ocr-mock
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: azure-ocr-mock}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: azure-ocr-mock}
  template:
    metadata:
      labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: azure-ocr-mock}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: azure-ocr-mock
          image: azure-ocr-mock
          ports: [{name: http, containerPort: 5000, protocol: TCP}]
          env:
            - {name: HOME, value: /tmp}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: dps-azure-ocr-mock
  labels: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: azure-ocr-mock}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: data-privacy-services, app.kubernetes.io/component: azure-ocr-mock}
  ports: [{name: http, port: 5000, targetPort: http, protocol: TCP}]
